site_name: Operating Systems
site_description: Lecture and lab materials for the Operating Systems class
# The repository is private, so Pages serves it from this generated domain.
# Making the repository public moves the site to
# https://cs-pub-ro.github.io/operating-systems-sessions/ -- change this then.
site_url: https://didactic-winner-kmm5z9n.pages.github.io/
repo_url: https://github.com/cs-pub-ro/operating-systems-sessions
repo_name: cs-pub-ro/operating-systems-sessions
# The pages are generated from the READMEs, so there is nothing to edit here.
edit_uri: ""

# Every page is generated by scripts/gen_pages.py from the READMEs under
# content/; `docs/` only has to exist.
docs_dir: docs
# Not `site/`, which is a directory of this repository.
site_dir: _site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.indexes
    # The live view and the full view are top-level entries of the navigation,
    # so each becomes a tab, and the sidebar of a page shows only the tab it is
    # in: a live page never lists the full half of a session, or the reverse.
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
