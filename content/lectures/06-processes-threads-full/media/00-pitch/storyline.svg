<text x="40.00" y="65.46" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1e1e1e" text-anchor="start" style="white-space:pre">Processes and Threads — one thread of the story</text>
<text x="40.00" y="99.31" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#495057" text-anchor="start" style="white-space:pre">running an application means making a process; follow it from here</text>
<text x="50.00" y="174.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">1</text>
<text x="147.50" y="207.70" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">Running an app</text>
<text x="147.50" y="259.18" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">620 processes,</text><text x="147.50" y="277.93" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">377 programs,</text><text x="147.50" y="296.68" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">one at 641% CPU</text>
<text x="295.00" y="174.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">2</text>
<text x="392.50" y="207.70" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">is a process</text>
<text x="392.50" y="259.18" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">an address space</text><text x="392.50" y="277.93" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">+ execution</text><text x="392.50" y="296.68" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">context(s)</text>
<text x="540.00" y="174.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">3</text>
<text x="637.50" y="207.70" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">Address space</text>
<text x="637.50" y="259.18" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">code + data,</text><text x="637.50" y="277.93" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">built from the</text><text x="637.50" y="296.68" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">executable</text>
<text x="785.00" y="174.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">4</text>
<text x="882.50" y="207.70" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">A thread</text>
<text x="882.50" y="268.55" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">IP: what to run</text><text x="882.50" y="287.30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">SP: its own stack</text>
<text x="1030.00" y="174.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">5</text>
<text x="1127.50" y="207.70" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">Threads share</text>
<text x="1127.50" y="268.55" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">one space,</text><text x="1127.50" y="287.30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">a stack each</text>
<text x="1030.00" y="634.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">6</text>
<text x="1127.50" y="655.83" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">Processes make</text><text x="1127.50" y="679.58" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">processes</text>
<text x="1127.50" y="728.55" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">create, wait,</text><text x="1127.50" y="747.30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">exit: a hierarchy</text>
<text x="785.00" y="634.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">7</text>
<text x="882.50" y="655.83" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">Zombies &amp;</text><text x="882.50" y="679.58" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">orphans</text>
<text x="882.50" y="728.55" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">wait for a child,</text><text x="882.50" y="747.30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">or init adopts it</text>
<text x="540.00" y="634.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">8</text>
<text x="637.50" y="655.83" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">Threads from</text><text x="637.50" y="679.58" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">a function</text>
<text x="637.50" y="728.55" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">pthread_create,</text><text x="637.50" y="747.30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">pthread_join</text>
<text x="295.00" y="634.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">9</text>
<text x="392.50" y="667.71" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">fork() + exec()</text>
<text x="392.50" y="728.55" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">copy, then replace</text><text x="392.50" y="747.30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">(clone underneath)</text>
<text x="50.00" y="634.12" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#868e96" text-anchor="start" style="white-space:pre">10</text>
<text x="147.50" y="667.71" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" text-anchor="middle" style="white-space:pre">Takeaway</text>
<text x="147.50" y="719.17" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">space + threads,</text><text x="147.50" y="737.92" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">a waited hierarchy,</text><text x="147.50" y="756.67" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#343a40" text-anchor="middle" style="white-space:pre">one clone()</text>
